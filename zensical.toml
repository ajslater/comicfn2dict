[project]
site_name = "comicfn2dict"
site_url = "https://comicfn2dict.readthedocs.io/"
site_author = "AJ"
site_description = "Parse common comic filenames and return a dict of metadata attributes."
nav = ["NEWS.md", "FILENAMES.md", "schema/comicfn2dict.schema.md"]
docs_dir = "docs"

[project.theme]
variant = "modern"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "orange"

[project.markdown_extensions]
smarty = {}
toc.permalink = true
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.quotes.callouts = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.api-autonav]
modules = ["comicfn2dict"]
